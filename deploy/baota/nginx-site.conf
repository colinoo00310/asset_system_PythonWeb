# 将 assets.example.com 替换为实际域名；未备案阶段可填写公网IP。
# 在宝塔创建纯静态站点后，将以下内容放入该站点的 server 配置中。

server {
    listen 80;
    server_name assets.example.com;
    root /www/wwwroot/AssetSystem/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    location ^~ /api/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_param Host $host;
        uwsgi_param X-Real-IP $remote_addr;
        uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        uwsgi_param X-Forwarded-Proto $scheme;
        uwsgi_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/asset-system.log;
    error_log /www/wwwlogs/asset-system.error.log;
}
